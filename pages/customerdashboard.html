<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/costumerdashboard.css" />
</head>
<body>
  <div id="dashboard">
    <aside id="sidebar">
      <div id="Managerlogo">
        <img src="../images/CustomerLogo.png" alt="CustomerLogo" width="70">
        <h2>Welcome<br>Customer!</h2>
      </div>
      <nav>
        <button class="sidebar-btn btn-blue" onclick="navigate('order')">My Order</button>
        <button class="sidebar-btn btn-blue" onclick="navigate('history')">Order History</button>
        <button class="sidebar-btn btn-blue" onclick="navigate('profile')">Profile</button>
        <button class="sidebar-btn btn-blue" onclick="navigate('support')">Support</button>
        <button class="sidebar-btn btn-green" onclick="navigate('logout')">Logout</button>
      </nav>
    </aside>

    <main id="main-content">
      <section id="dishes-container" class="grid">
      </section>
    </main>
  </div>

  <script src="../js/customer-dashboard.js"></script>
</body>
</html>
