<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Choose User</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="home-body">
  <h1>KupaRashit</h1>
  <div class="cashier-icon">🧾</div>

  <div class="btn-container">
    <button class="btn" onclick="chooseUser('manager')">Staff</button>
    <button class="btn" onclick="chooseUser('customer')">Customer</button>
  </div>

  <script>
    function chooseUser(type) {
      localStorage.setItem("userType", type);
      if (type === "manager") {
        window.location.href = "/pages/adminlogin.html";
      } else {
        window.location.href = "/pages/customerlogin.html";
      }
    }
  </script>
</body>
</html>
